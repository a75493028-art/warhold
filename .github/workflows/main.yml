name: iOS Build/Release Action

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run iOS Build
        uses: hectorguerrini/build-ios-action@v1.0.4
        with:
          project-path: ""
          p12-base64: ""
          base64-encoded-mobileprovision-file: ""
          mobileprovision-bundle: ""
          code-signing-identity: ""
          team-id: ""
